services:
  - type: web
    name: frontdesk-api
    runtime: node
    region: frankfurt          # closest EU region (GDPR)
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "4000"
      - key: CORS_ORIGINS
        sync: false             # set to your Vercel URL in the Render dashboard
      - key: MONGODB_URI
        sync: false
      - key: VECTOR_INDEX_NAME
        value: chunks_vector_index
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: ADMIN_KEY
        sync: false
      - key: HANDOFF_EMAIL
        sync: false
      - key: CHAT_RETENTION_DAYS
        value: "30"
      - key: LEAD_RETENTION_DAYS
        value: "90"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFICATION_WEBHOOK_URL
        sync: false
